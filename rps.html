<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Rock, Paper, Scissors</h1>
    <p>Choose your move!</p>

    <div class="choices">
      <button id="rock-button">✊<br>Rock</button>
      <button id="paper-button">✋<br>Paper</button>
      <button id="scissors-button">✌️<br>Scissors</button>
    </div>

    <p id="battle">❔ vs ❔</p>
    <p id="message">Who will win?</p>
    <p id="score">You: 0 &nbsp; Computer: 0</p>

    <p><a href="index.html">Back to the arcade</a></p>

    <script src="rps.js"></script>
  </body>
</html>
