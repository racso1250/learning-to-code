<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Carpet People</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Carpet People</h1>

    <div class="hud">
      <span id="level">Level 1</span>
      <span id="crumbs">Crumbs: 0</span>
    </div>

    <!-- 15 tiles wide x 11 tiles tall, 32 pixels each -->
    <canvas id="game" width="480" height="352"></canvas>

    <p id="message">Collect all the crumbs!</p>
    <p class="help">Arrow keys or WASD to move. R to restart the level.</p>

    <p id="free-play-link" hidden><a class="big-link" href="freeplay.html">🗺️ Play Free Play mode</a></p>

    <p><a href="index.html">Back to the arcade</a></p>

    <script src="shared.js"></script>
    <script src="levels.js"></script>
    <script src="sounds.js"></script>
    <script src="carpet.js"></script>
  </body>
</html>
