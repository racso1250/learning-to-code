<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Carpet People: Free Play</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Free Play</h1>

    <!-- Shown if you haven't unlocked Free Play yet -->
    <div id="locked" hidden>
      <p>🔒 Free Play is locked!</p>
      <p>Collect all the crumbs in every level to unlock it.</p>
      <p><a class="big-link" href="carpet.html">Play the levels</a></p>
    </div>

    <!-- The game itself -->
    <div id="game-area" hidden>
      <div class="hud">
        <span id="explored">Explored: 0%</span>
        <span id="crumbs">Crumbs eaten: 0</span>
      </div>

      <canvas id="game"></canvas>

      <p id="message">Explore the giant carpet!</p>
      <p class="help">Arrow keys or WASD to move.</p>

      <div class="panel">
        <div class="box">
          <h2>Map</h2>
          <canvas id="minimap" width="160" height="96"></canvas>
        </div>

        <div class="box">
          <h2>Quests</h2>
          <div id="quests"></div>
        </div>

        <div class="box">
          <h2>Characters</h2>
          <div id="characters"></div>
        </div>
      </div>
    </div>

    <p><a href="carpet.html">Back to the levels</a></p>

    <!-- Three.js: a library for 3D graphics (needs the internet to load) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="shared.js"></script>
    <script src="world.js"></script>
    <script src="sounds.js"></script>
    <script src="render3d.js"></script>
    <script src="freeplay.js"></script>
  </body>
</html>
